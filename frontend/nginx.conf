server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Hashed asset filenames are immutable and safe to cache forever.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # index.html must NEVER be cached. Vite emits hash-named chunks; a stale
  # index.html after a deploy points at chunks that no longer exist and the app
  # renders a blank page.
  location = /index.html {
    add_header Cache-Control "no-store, must-revalidate";
  }

  location = /healthz {
    access_log off;
    add_header Content-Type text/plain;
    return 200 'ok';
  }

  # The SPA owns routing, so every unknown path returns index.html. This is what
  # makes deep links and refresh work once TanStack Router lands.
  #
  # NOTE: /api is routed to the API container by Traefik before it ever reaches
  # this server, so there is no /api location here. If that ever changes, /api
  # MUST be matched before this block -- otherwise a 401 JSON response becomes a
  # 200 HTML document, the frontend's 401 handling never fires, and the session
  # appears to hang instead of redirecting to login.
  location / {
    try_files $uri $uri/ /index.html;
  }

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;

  server_tokens off;
}
