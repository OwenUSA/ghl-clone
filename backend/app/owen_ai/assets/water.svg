 <defs><marker id="ar" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
  <path d="M0 0 L10 5 L0 10z" fill="#2563eb"/></marker></defs>
 <g stroke="#2563eb" stroke-width="4" fill="none" stroke-linecap="round" marker-end="url(#ar)">
